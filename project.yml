name: Rightful
options:
  bundleIdPrefix: com.rightful
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Rightful:
    type: application
    platform: iOS
    sources:
      - path: Rightful
        excludes:
          - Resources/Products.storekit
          - Resources/Fonts/OFL-Bricolage.txt
          - Resources/Fonts/OFL-Hanken.txt
          - Resources/Fonts/OFL-IBMPlex.txt
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Rightful
        CFBundleURLTypes:
          - CFBundleURLName: com.rightful.app
            CFBundleURLSchemes:
              - rightful
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.finance
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - BricolageGrotesque.ttf
          - HankenGrotesk.ttf
          - IBMPlexMono-Regular.ttf
        NSUserNotificationsUsageDescription: Rightful alerts you before claim deadlines and when a payout window opens.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
    entitlements:
      path: Config/Rightful.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rightful.app
        PRODUCT_NAME: Rightful
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APS_ENVIRONMENT: development
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          APS_ENVIRONMENT: production
          SWIFT_COMPILATION_MODE: wholemodule
    configFiles:
      Debug: Config/Defaults.xcconfig
      Release: Config/Defaults.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    scheme:
      testTargets:
        - RightfulTests
      storeKitConfiguration: Rightful/Resources/Products.storekit

  RightfulTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RightfulTests
    dependencies:
      - target: Rightful
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rightful.app.tests
        GENERATE_INFOPLIST_FILE: YES
